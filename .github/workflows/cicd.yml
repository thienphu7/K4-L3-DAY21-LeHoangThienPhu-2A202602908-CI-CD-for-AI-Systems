name: Income Model CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**'
      - 'params.yaml'
      - 'requirements.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: income-production
  cancel-in-progress: false
jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - name: Pull data with DVC
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CREDENTIALS }}
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          test -n "$MLFLOW_TRACKING_URI" || { echo 'Missing MLFLOW_TRACKING_URI'; exit 1; }
          test -n "$MLFLOW_TRACKING_USERNAME" || { echo 'Missing MLFLOW_TRACKING_USERNAME'; exit 1; }
          test -n "$MLFLOW_TRACKING_PASSWORD" || { echo 'Missing MLFLOW_TRACKING_PASSWORD'; exit 1; }
          python src/train.py
      - name: Generate precision and recall report
        run: python -m src.detail
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('outputs/report.json'))
          print(report)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"f1={report['f1_score']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib
          if-no-files-found: error
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math, os
          f1 = float(os.environ['F1'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f'FAILED: f1_score={f1}; expected >= 0.65 and <= 1.0')
          print(f'PASSED: f1_score={f1:.6f}')
          PY
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models
      - run: python -m pip install azure-storage-blob==12.31.0
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - name: Compare production F1 and publish approved model
        id: publish
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.release
      - name: Copy inference server to VM
        if: steps.publish.outputs.deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}
      - name: Record rejected deployment
        if: steps.publish.outputs.deploy != 'true'
        run: echo 'Deployment canceled because candidate F1 is lower; production model and service retained.'
      - name: Restart API and verify health
        if: steps.publish.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo -n systemctl restart income-api
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 http://localhost:8080/healthz; then
                echo 'Health check passed.'
                exit 0
              fi
              sleep 2
            done
            sudo -n journalctl -u income-api -n 30 --no-pager
            exit 1
